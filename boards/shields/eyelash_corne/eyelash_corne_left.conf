# =============================================================================
# 補足
# =============================================================================

# CONFIG_ZMK_SLEEP=y は共通設定の eyelash_corne.conf から継承される。
# このファイルでは左側（Central側）固有の設定を定義する。


# =============================================================================
# External Power
# =============================================================================

# 外部電源制御機能を有効化する。
# 現在値：y（有効）
CONFIG_ZMK_EXT_POWER=y


# =============================================================================
# ロータリーエンコーダ（EC11）
# =============================================================================

# EC11ロータリーエンコーダを有効化する。
# 現在値：y（有効）
CONFIG_EC11=y

# EC11のトリガー処理をGlobal Threadで実行する。
# 現在値：y（有効）
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y


# =============================================================================
# ZMK Studio（Central側のみ）
# =============================================================================

# ZMK Studio機能を有効化する。
# 現在値：y（有効）
CONFIG_ZMK_STUDIO=y

# BLE Managementモジュールを有効化する。
# 現在値：y（有効）
CONFIG_ZMK_BLE_MANAGEMENT=y

# BLE ManagementをZMK Studioから操作するためのRPCを有効化する。
# 現在値：y（有効）
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y


# =============================================================================
# Runtime Input Processor（Central側のみ）
# =============================================================================

# Runtime Input Processorを有効化する。
# 現在値：y（有効）
# → ポインティングデバイス等の入力処理を実行時に変更・加工するために使用する。
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y

# Runtime Input ProcessorをZMK Studioから操作するためのRPCを有効化する。
# 現在値：y（有効）
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y


# =============================================================================
# Settings RPC（Central側のみ）
# =============================================================================

# ZMKのSettings RPC機能を有効化する。
# 現在値：y（有効）
CONFIG_ZMK_SETTINGS_RPC=y

# Settings RPCをZMK Studioから利用できるようにする。
# 現在値：y（有効）
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y


# =============================================================================
# Runtime Sensor Rotate（Central側のみ）
# =============================================================================

# Runtime Sensor Rotate機能を有効化する。
# 現在値：y（有効）
# → ロータリーエンコーダ等のセンサー入力方向を実行時に変更するために使用する。
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y

# Runtime Sensor RotateをZMK Studioから操作するためのRPCを有効化する。
# 現在値：y（有効）
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y


# =============================================================================
# Settings（Central側のみ）
# =============================================================================

# ZephyrのSettings機能を有効化する。
# 現在値：y（有効）
# → ZMK Studioや各種Runtime設定の保存に使用する。
CONFIG_SETTINGS=y


# =============================================================================
# Battery History（Central側のみ）
# =============================================================================

# バッテリー履歴機能の使用有無を設定する。
# 現在値：n（無効）
# → 現在はバッテリー状態の履歴記録を使用しない。
CONFIG_ZMK_BATTERY_HISTORY=n

# Battery HistoryをZMK Studioから利用するためのRPC。
# 現在値：n（無効）
# → Battery History本体が無効のため、Studio RPCも無効。
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=n


# =============================================================================
# Split Keyboard（Central側のみ）
# =============================================================================

# Split間でイベントを中継する機能を有効化する。
# 現在値：y（有効）
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# Central側のSplit BLE処理に使用するスタックサイズ。
# 現在値：1024 bytes
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024

# Settingsを書き込む際のデバウンス時間。
# 現在値：10,000ms（10秒）
# → 設定変更のたびに即座にFlashへ書き込まず、
#    10秒間まとめてから保存する。
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000