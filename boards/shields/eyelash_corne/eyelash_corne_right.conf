# =============================================================================
# 補足
# =============================================================================

# このファイルでは右側（Peripheral側）固有の設定を定義する。


# =============================================================================
# External Power
# =============================================================================

# 外部電源制御機能を有効化する。
# 現在値：y（有効）
CONFIG_ZMK_EXT_POWER=y


# =============================================================================
# ロータリーエンコーダ（EC11）
# =============================================================================

# EC11ロータリーエンコーダを有効化する。
# 現在値：y（有効）
CONFIG_EC11=y

# EC11のトリガー処理をGlobal Threadで実行する。
# 現在値：y（有効）
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y


# =============================================================================
# Input
# =============================================================================

# ZephyrのInput Subsystemを有効化する。
# 現在値：y（有効）
# → ポインティングデバイス等の入力デバイスを使用するための基本機能。
CONFIG_INPUT=y


# =============================================================================
# Battery（Peripheral側）
# =============================================================================

# バッテリー履歴機能の使用有無を設定する。
# 現在値：n（無効）
# → 現在はバッテリー状態の履歴記録を使用しない。
CONFIG_ZMK_BATTERY_HISTORY=n

# バッテリー履歴を記録する場合の記録間隔を設定する。
# 現在値：30分
# → Battery Historyが有効な場合、30分間隔で履歴を記録する。
# → 現在はCONFIG_ZMK_BATTERY_HISTORY=nのため、履歴記録自体は無効。
CONFIG_ZMK_BATTERY_HISTORY_INTERVAL_MINUTES=30


# =============================================================================
# Settings RPC
# =============================================================================

# ZMKのSettings RPC機能を有効化する。
# 現在値：y（有効）
CONFIG_ZMK_SETTINGS_RPC=y


# =============================================================================
# Split Keyboard
# =============================================================================

# Split間でイベントを中継する機能を有効化する。
# 現在値：y（有効）
CONFIG_ZMK_SPLIT_RELAY_EVENT=y


# =============================================================================
# Settings
# =============================================================================

# Settingsを書き込む際のデバウンス時間。
# 現在値：10,000ms（10秒）
# → 設定変更のたびに即座にFlashへ書き込まず、
#    10秒間まとめてから保存する。
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000