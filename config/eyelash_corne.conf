# =============================================================================
# 電源管理 / スリープ
# =============================================================================

# 通常のアイドルタイムアウトを設定する。
# 現在値：300,000ms（5分）
# → 5分間操作がない場合、Idle状態へ移行する。
# → Bluetooth接続は維持されるため、キー入力ですぐに復帰できる。
# → ディスプレイや照明などの周辺機器を停止し、消費電力を抑える。
CONFIG_ZMK_IDLE_TIMEOUT=300000

# Deep Sleepへ移行するまでの時間を設定する。
# 現在値：900,000ms（15分）
# → 15分間操作がない場合、Deep Sleepへ移行する。
# → Bluetooth接続も切断され、Idle状態よりさらに消費電力を抑える。
# → 復帰後はBluetoothの再接続に少し時間がかかる場合がある。
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ZMKのDeep Sleep機能を有効化する。
# 現在値：y（有効）
CONFIG_ZMK_SLEEP=y


# =============================================================================
# RGB Underglow
# =============================================================================

# WS2812系RGB LEDストリップのドライバを有効化する。
# 現在値：y（有効）
CONFIG_WS2812_STRIP=y

# RGB Underglow機能を有効化する。
# 現在値：y（有効）
CONFIG_ZMK_RGB_UNDERGLOW=y

# 起動時にRGB Underglowを自動点灯する。
# 現在値：y（起動時に自動点灯）
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Idle状態になったときRGB Underglowを自動消灯する。
# 現在値：y（Idle時に自動消灯）
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# 起動時の色相（Hue）を設定する。
# 現在値：160
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160

# 起動時に使用するRGBエフェクトを設定する。
# 現在値：3
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3


# =============================================================================
# HID / キー入力
# =============================================================================

# NKRO（N-Key Rollover）の使用有無を設定する。
# 現在値：n（無効）
# → 現在はNKROを使用しない。
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

# Consumer KeyをBasic HID Usageとして扱う。
# 現在値：y（有効）
# → C_AC_SEARCHなどのConsumer KeyのOS互換性を高める。
# → macOSで「辞書で調べる」をキーから呼び出すために必要。
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y


# =============================================================================
# ロータリーエンコーダ（EC11）
# =============================================================================

# EC11ロータリーエンコーダを有効化する。
# 現在値：y（有効）
CONFIG_EC11=y

# EC11のトリガー処理をGlobal Threadで実行する。
# 現在値：y（有効）
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y


# =============================================================================
# ポインティングデバイス / マウス
# =============================================================================

# ZMKのPointing Device機能を有効化する。
# 現在値：y（有効）
# → マウスキーやトラックボール等のポインティング機能を使用できる。
CONFIG_ZMK_POINTING=y

# ポインティングデバイスのスムーズスクロールを有効化する。
# 現在値：y（有効）
# → 通常の段階的なスクロールより細かなスクロール量を扱える。
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y


# =============================================================================
# Backlight
# =============================================================================

# キーバックライト機能を有効化する。
# 現在値：y（有効）
CONFIG_ZMK_BACKLIGHT=y

# 起動時のバックライト輝度を設定する。
# 現在値：100（100%）
# → 起動時は最大輝度で点灯する。
CONFIG_ZMK_BACKLIGHT_BRT_START=100


# =============================================================================
# Bluetooth
# =============================================================================

# Bluetoothの送信出力を+8dBmにする設定。
# 現在値：コメントアウト（無効）
# → 現在は+8dBmへの送信出力強化を使用していない。
# → 必要になった場合は先頭の # を削除して有効化する。
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y


# =============================================================================
# キースキャン / デバウンス
# =============================================================================

# キー押下時のデバウンス時間を設定する。
# 現在値：5ms
# → キーを押した際、5msのデバウンス処理を行う。
# → 小さくすると入力遅延を減らせるが、
#    スイッチによってはチャタリングが発生しやすくなる。
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5

# キー解放時のデバウンス時間を設定する。
# 現在値：5ms
# → キーを離した際、5msのデバウンス処理を行う。
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5


# =============================================================================
# Soft Off
# =============================================================================

# ZMKのSoft Off機能を有効化する。
# 現在値：y（有効）
# → ファームウェアからキーボードを低消費電力状態へ移行できる。
CONFIG_ZMK_PM_SOFT_OFF=y